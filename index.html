<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PDFリーダー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* Layout: one-screen reader — top bar, page stage that fills the rest, bottom toolbar; tap the middle to hide the bars */
:root{
  --bg:#f5f2f3; --surface:#ffffff; --stage:#e6e1e3; --fg:#2e2a2c; --muted:#76696f; --line:#e2d9dd; --accent:#c0577d; --accent-soft:#f6e6ec; --on-accent:#ffffff; --shadow:rgba(40,20,30,.18);
  --sans:"Noto Sans JP","Noto Sans CJK JP","Hiragino Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1c181a; --surface:#262124; --stage:#121011; --fg:#f1e9ec; --muted:#b3a5ab; --line:#3b3236; --accent:#ec93b4; --accent-soft:#3a2830; --on-accent:#1c181a; --shadow:rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1c181a; --surface:#262124; --stage:#121011; --fg:#f1e9ec; --muted:#b3a5ab; --line:#3b3236; --accent:#ec93b4; --accent-soft:#3a2830; --on-accent:#1c181a; --shadow:rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.5;display:flex;flex-direction:column;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13px;white-space:nowrap}
button:disabled{opacity:.4;cursor:default}
button.icon{width:38px;height:38px;padding:0;display:inline-flex;align-items:center;justify-content:center;font-size:16px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
button:focus-visible,select:focus-visible,input:focus-visible,label.btn:focus-within{outline:2px solid var(--accent);outline-offset:2px}
label.btn{display:inline-flex;align-items:center;cursor:pointer;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:700;background:var(--accent);color:var(--on-accent);position:relative;white-space:nowrap}
label.btn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}

.bar{background:var(--surface);border-color:var(--line);display:flex;align-items:center;gap:8px;padding-inline:12px;z-index:3;transition:transform .2s,opacity .2s}
.top{border-bottom:1px solid var(--line);padding-block:8px}
.top h1{font-size:15px;margin:0;letter-spacing:.05em;flex:none}
.fname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:12px}
.fname b{color:var(--fg);font-weight:500;font-size:13px}
.bottom{border-top:1px solid var(--line);flex-direction:column;align-items:stretch;gap:8px;padding-block:8px calc(8px + env(safe-area-inset-bottom,0px))}
.row{display:flex;align-items:center;gap:8px;overflow-x:auto;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.nav input[type=range]{flex:1;min-width:80px;accent-color:var(--accent)}
.pno{font-variant-numeric:tabular-nums;font-size:13px;min-width:64px;text-align:center;flex:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;gap:2px;flex:none;background:var(--bg)}
.seg button{border:0;background:transparent;padding:6px 11px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:700}
.zoomv{font-variant-numeric:tabular-nums;font-size:12px;min-width:44px;text-align:center;flex:none;color:var(--muted)}
.sp{flex:1}
body.immersive .top{transform:translateY(-100%);opacity:0;pointer-events:none;position:absolute;left:0;right:0;top:0}
body.immersive .bottom{transform:translateY(100%);opacity:0;pointer-events:none;position:absolute;left:0;right:0;bottom:0}

.stage{flex:1;min-height:0;position:relative;background:var(--stage);overflow:hidden;touch-action:pan-y}
.stage.zoomed,.stage.scrolly{overflow:auto;touch-action:auto}
.spread-wrap{min-width:100%;min-height:100%;display:flex;align-items:center;justify-content:center;padding:12px}
.pages{display:flex;gap:0;filter:drop-shadow(0 4px 14px var(--shadow))}
.pages.rtl{flex-direction:row-reverse}
.pages canvas{display:block;background:#fff}
.pages.two canvas:first-child{box-shadow:inset -10px 0 12px -10px rgba(0,0,0,.25)}
.list{display:flex;flex-direction:column;align-items:center;gap:14px;padding:14px 12px 40px}
.list .ph{background:#fff;box-shadow:0 3px 12px var(--shadow);position:relative}
.list .ph canvas{display:block;width:100%;height:100%}
.list .ph span,.grid .cell span{position:absolute;right:6px;bottom:6px;font-size:11px;color:#6d6268;background:rgba(255,255,255,.85);border-radius:999px;padding:0 7px;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:14px;padding:14px}
.grid.rtl{direction:rtl}
.grid .cell{position:relative;background:#fff;box-shadow:0 2px 8px var(--shadow);cursor:pointer;border:0;padding:0;border-radius:2px;outline-offset:3px}
.grid .cell.cur{outline:3px solid var(--accent)}
.grid .cell canvas{display:block;width:100%;height:auto}
.toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:var(--fg);color:var(--bg);font-size:12px;padding:5px 12px;border-radius:999px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:2;white-space:nowrap}
.toast.on{opacity:.92}

.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px}
.empty-box{max-width:360px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.empty-box p{margin:0;color:var(--muted)}
.dropping .stage{outline:3px dashed var(--accent);outline-offset:-10px}

.modal{position:fixed;inset:0;background:rgba(15,10,12,.6);display:flex;align-items:flex-end;justify-content:center;z-index:10;padding:0}
@media (min-width:640px){.modal{align-items:center;padding:16px}}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:640px){.sheet{border-radius:18px}}
.sheet h2{margin:0;font-size:16px;display:flex;justify-content:space-between;align-items:center}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:12px;color:var(--muted)}
.field input[type=text],.field select{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;font-size:16px;width:100%}
.radios{display:flex;flex-wrap:wrap;gap:6px}
.radios label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.radios input{accent-color:var(--accent);margin:0}
.radios label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.note{font-size:12px;color:var(--muted);margin:0}
.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.results figure{margin:0;display:flex;flex-direction:column;gap:6px;min-width:0}
.results img{width:100%;height:auto;background:#fff;border:1px solid var(--line);border-radius:4px}
.results figcaption{font-size:11px;color:var(--muted);overflow-wrap:anywhere}
.results a{font-size:12px;color:var(--accent);font-weight:700;text-decoration:none}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.prog{font-size:13px;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){.bar,.toast{transition:none}}
</style>

<header class="bar top" id="top">
  <h1>PDFリーダー</h1>
  <div class="fname" id="fname">PDFを開いてください</div>
  <label class="btn" title="PDFを開く">開く<input type="file" id="fileIn" accept="application/pdf,.pdf" aria-label="PDFファイルを開く"></label>
  <button type="button" id="saveBtn" disabled>保存</button>
</header>

<main class="stage" id="stage" tabindex="-1">
  <div class="empty" id="empty">
    <div class="empty-box">
      <p id="emptyMsg">PDFを読み込んでいます…</p>
    </div>
  </div>
  <div class="toast" id="toast"></div>
</main>

<footer class="bar bottom" id="bottom">
  <div class="row nav">
    <button type="button" class="icon" id="btnL" aria-label="左のページへ">◀</button>
    <input type="range" id="slider" min="1" max="1" value="1" aria-label="ページ">
    <button type="button" class="icon" id="btnR" aria-label="右のページへ">▶</button>
    <span class="pno" id="pno">– / –</span>
  </div>
  <div class="row">
    <div class="seg" id="segMode" role="group" aria-label="表示">
      <button type="button" data-v="single">1ページ</button><button type="button" data-v="spread">見開き</button><button type="button" data-v="scroll">スクロール</button><button type="button" data-v="grid">一覧</button>
    </div>
    <div class="seg" id="segDir" role="group" aria-label="綴じ方向">
      <button type="button" data-v="rtl">右綴じ</button><button type="button" data-v="ltr">左綴じ</button>
    </div>
    <button type="button" class="icon" id="zOut" aria-label="縮小">－</button>
    <span class="zoomv" id="zoomv">100%</span>
    <button type="button" class="icon" id="zIn" aria-label="拡大">＋</button>
    <button type="button" id="zFit">画面に合わせる</button>
    <button type="button" id="coverBtn" aria-pressed="true">表紙は1ページで</button>
  </div>
</footer>

<div class="modal" id="saveModal" hidden>
  <div class="sheet" role="dialog" aria-labelledby="saveTitle">
    <h2><span id="saveTitle">ページを画像で保存</span><button type="button" class="icon" id="saveClose" aria-label="閉じる">✕</button></h2>
    <div class="field"><span>保存するページ</span>
      <div class="radios">
        <label><input type="radio" name="tgt" value="cur" checked><span id="tgtCurLabel">表示中のページ</span></label>
        <label><input type="radio" name="tgt" value="all">全ページ</label>
        <label><input type="radio" name="tgt" value="range">ページを指定</label>
      </div>
      <input type="text" id="rangeIn" placeholder="例）1-3, 5, 8" inputmode="text" hidden>
    </div>
    <div class="field"><span>形式</span>
      <div class="radios">
        <label><input type="radio" name="fmt" value="png" checked>PNG</label>
        <label><input type="radio" name="fmt" value="jpeg">JPEG</label>
      </div>
    </div>
    <div class="field"><span>解像度</span>
      <select id="dpiSel">
        <option value="150">150dpi（スマホで見る用）</option>
        <option value="200" selected>200dpi（SNS・告知用）</option>
        <option value="300">300dpi（印刷用）</option>
        <option value="350">350dpi（印刷所への入稿）</option>
      </select>
      <p class="note" id="sizeNote"></p>
    </div>
    <div class="actions"><button type="button" class="primary" id="makeBtn">画像を作る</button></div>
    <p class="prog" id="prog" hidden></p>
    <div id="resWrap" hidden>
      <p class="note">「保存」が反応しないときは、画像を長押し（パソコンは右クリック）して保存してください。</p>
      <div class="actions" style="justify-content:flex-start;margin:10px 0"><a id="zipLink" hidden><button type="button" class="primary" tabindex="-1">ZIPでまとめて保存</button></a></div>
      <div class="results" id="results"></div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

const $=id=>document.getElementById(id);
const stage=$('stage'),empty=$('empty'),emptyMsg=$('emptyMsg');
const PREF_KEY='pdf-reader-prefs-v1';
let prefs={mode:'single',dir:'rtl',cover:true,dpi:'200',fmt:'png'};
try{Object.assign(prefs,JSON.parse(localStorage.getItem(PREF_KEY))||{})}catch(e){}
const savePrefs=()=>{try{localStorage.setItem(PREF_KEY,JSON.stringify(prefs))}catch(e){}};

let task=null,doc=null,fileBase='page',pageSizes=[],cur=1,zoom=1,token=0,io=null;

/* ---------- helpers ---------- */
const mm=pt=>pt*25.4/72;
function paperName(wPt,hPt){
  const w=Math.round(mm(Math.min(wPt,hPt))),h=Math.round(mm(Math.max(wPt,hPt)));
  const P={A4:[210,297],A5:[148,210],A6:[105,148],B5:[182,257],B6:[128,182],'文庫':[105,148]};
  for(const[k,[a,b]]of Object.entries(P))if(Math.abs(w-a)<=2&&Math.abs(h-b)<=2)return`${k}（${w}×${h}mm）`;
  return`${w}×${h}mm`;
}
let toastT;function toast(t){const el=$('toast');el.textContent=t;el.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('on'),1400)}
const rtl=()=>prefs.dir==='rtl';

/* pages shown together in spread mode */
function group(p){
  if(prefs.mode!=='spread')return[p];
  const n=doc.numPages;
  if(prefs.cover){if(p===1)return[1];const a=p%2===0?p:p-1;return a+1<=n?[a,a+1]:[a]}
  const a=p%2===1?p:p-1;return a+1<=n?[a,a+1]:[a];
}

/* ---------- loading ---------- */
function waitLib(){return new Promise((res,rej)=>{const t0=Date.now();(function chk(){if(window.pdfjsLib)return res(window.pdfjsLib);if(Date.now()-t0>15000)return rej();setTimeout(chk,60)})()})}
async function openData(data,name){
  let lib;
  try{lib=await waitLib()}catch(e){showEmpty('PDFを表示する部品を読み込めませんでした。通信状態を確認して、ページを再読み込みしてください。');return}
  if(lib.GlobalWorkerOptions&&!lib.GlobalWorkerOptions.workerSrc)lib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  showEmpty('PDFを開いています…');
  try{
    const t=lib.getDocument({data}),d=await t.promise;
    if(task)try{task.destroy()}catch(e){}
    task=t;
    doc=d;pageSizes=[];
    for(let i=1;i<=doc.numPages;i++){const pg=await doc.getPage(i);const v=pg.getViewport({scale:1});pageSizes.push([v.width,v.height])}
    fileBase=(name||'document').replace(/\.pdf$/i,'').replace(/[\\/:*?"<>|\s]+/g,'_')||'page';
    $('fname').innerHTML=`<b></b><br>${doc.numPages}ページ ・ ${paperName(...pageSizes[0])}`;
    $('fname').querySelector('b').textContent=name||'document.pdf';
    $('slider').max=doc.numPages;$('saveBtn').disabled=false;
    cur=1;zoom=1;empty.hidden=true;render();
  }catch(err){
    console.warn('open failed',err);
    const pw=err&&err.name==='PasswordException';
    showEmpty(pw?'パスワードが付いたPDFは開けません。':'このファイルはPDFとして開けませんでした。別のファイルを選んでください。');
  }
}
function showEmpty(t){clearView();empty.hidden=false;emptyMsg.textContent=t}
$('fileIn').addEventListener('change',e=>{const f=e.target.files[0];if(f)readFile(f);e.target.value=''});
function readFile(f){f.arrayBuffer().then(b=>openData(new Uint8Array(b),f.name))}
window.addEventListener('dragover',e=>{e.preventDefault();document.body.classList.add('dropping')});
window.addEventListener('dragleave',e=>{if(e.target===document.documentElement||!e.relatedTarget)document.body.classList.remove('dropping')});
window.addEventListener('drop',e=>{e.preventDefault();document.body.classList.remove('dropping');const f=[...e.dataTransfer.files].find(f=>/pdf$/i.test(f.type)||/\.pdf$/i.test(f.name));if(f)readFile(f)});

/* ---------- rendering ---------- */
function clearView(){if(io){io.disconnect();io=null}stage.querySelectorAll('.spread-wrap,.list,.grid').forEach(n=>n.remove());stage.classList.remove('zoomed','scrolly')}
async function drawPage(n,canvas,cssW,my){
  const pg=await doc.getPage(n);if(my!==token)return;
  const base=pg.getViewport({scale:1}),sc=cssW/base.width,dpr=Math.min(window.devicePixelRatio||1,3);
  const vp=pg.getViewport({scale:sc*dpr});
  canvas.width=Math.round(vp.width);canvas.height=Math.round(vp.height);
  canvas.style.width=cssW+'px';canvas.style.height=Math.round(base.height*sc)+'px';
  await pg.render({canvasContext:canvas.getContext('2d'),viewport:vp}).promise.catch(()=>{});
}
function render(){
  if(!doc)return;
  const my=++token;clearView();updateUI();
  const W=stage.clientWidth,H=stage.clientHeight;
  if(prefs.mode==='single'||prefs.mode==='spread'){

    const wrap=document.createElement('div');wrap.className='spread-wrap';
    const box=document.createElement('div');box.className='pages'+(rtl()?' rtl':'')+(g.length>1?' two':'');
    wrap.appendChild(box);stage.appendChild(wrap);
    const totW=g.reduce((s,p)=>s+pageSizes[p-1][0],0),maxH=Math.max(...g.map(p=>pageSizes[p-1][1]));
    const fit=Math.min((W-24)/totW,(H-24)/maxH);
    const sc=fit*zoom;
    stage.classList.toggle('zoomed',zoom>1.001);
    g.forEach(p=>{const c=document.createElement('canvas');c.setAttribute('aria-label',`${p}ページ`);box.appendChild(c);drawPage(p,c,pageSizes[p-1][0]*sc,my)});
  }else if(prefs.mode==='scroll'){
    stage.classList.add('scrolly');
    const list=document.createElement('div');list.className='list';stage.appendChild(list);
    const colW=Math.min(W-24,(W-24)*zoom,900*zoom);
    io=new IntersectionObserver(es=>{es.forEach(e=>{const el=e.target;if(e.isIntersecting&&!el.dataset.done){el.dataset.done=1;const c=document.createElement('canvas');el.prepend(c);drawPage(+el.dataset.p,c,el.clientWidth,my)}})},{root:stage,rootMargin:'600px 0px'});
    const seen=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting&&e.intersectionRatio>.5){cur=+e.target.dataset.p;updateUI(true)}})},{root:stage,threshold:[.5]});
    for(let p=1;p<=doc.numPages;p++){
      const [w,h]=pageSizes[p-1];const el=document.createElement('div');el.className='ph';el.dataset.p=p;
      el.style.width=colW+'px';el.style.height=(colW*h/w)+'px';el.innerHTML=`<span>${p}</span>`;list.appendChild(el);io.observe(el);seen.observe(el);
    }
    const prevIo=io;io={disconnect(){prevIo.disconnect();seen.disconnect()}};
    const target=list.children[cur-1];if(target)stage.scrollTop=target.offsetTop-14;
  }else{
    stage.classList.add('scrolly');
    const grid=document.createElement('div');grid.className='grid'+(rtl()?' rtl':'');stage.appendChild(grid);
    const ob=new IntersectionObserver(es=>{es.forEach(e=>{const el=e.target;if(e.isIntersecting&&!el.dataset.done){el.dataset.done=1;const c=el.querySelector('canvas');drawPage(+el.dataset.p,c,el.clientWidth,my)}})},{root:stage,rootMargin:'400px 0px'});
    for(let p=1;p<=doc.numPages;p++){
      const [w,h]=pageSizes[p-1];const b=document.createElement('button');b.type='button';b.className='cell'+(p===cur?' cur':'');b.dataset.p=p;b.setAttribute('aria-label',`${p}ページを開く`);
      b.innerHTML=`<canvas style="aspect-ratio:${w}/${h}"></canvas><span>${p}</span>`;grid.appendChild(b);ob.observe(b);
    }
    io=ob;
    grid.addEventListener('click',e=>{const c=e.target.closest('.cell');if(!c)return;cur=+c.dataset.p;prefs.mode='single';savePrefs();zoom=1;render()});
    const t=grid.children[cur-1];if(t)requestAnimationFrame(()=>{stage.scrollTop=t.offsetTop-20});
  }
}

  $('slider').value=cur;
  $('slider').style.direction=rtl()?'rtl':'ltr';
  const first=g[0]<=1,last=g[g.length-1]>=n;
  $('btnL').disabled=!doc||(rtl()?last:first);$('btnR').disabled=!doc||(rtl()?first:last);
  $('btnL').setAttribute('aria-label',rtl()?'次のページへ':'前のページへ');$('btnR').setAttribute('aria-label',rtl()?'前のページへ':'次のページへ');

  $('coverBtn').setAttribute('aria-pressed',String(prefs.cover));$('coverBtn').hidden=prefs.mode!=='spread';
  $('coverBtn').textContent=prefs.cover?'表紙は1ページで：オン':'表紙は1ページで：オフ';
  const zoomable=prefs.mode!=='grid';
  ['zOut','zIn','zFit'].forEach(id=>$(id).disabled=!doc||!zoomable);
  $('zoomv').textContent=Math.round(zoom*100)+'%';
}

/* ---------- navigation ---------- */
function step(d){ // d=+1 next, -1 prev
  if(!doc)return;const n=doc.numPages,g=group(cur);
  let t=d>0?g[g.length-1]+1:g[0]-1;
  if(t<1||t>n){toast(d>0?'最後のページです':'最初のページです');return}
  if(d<0)t=group(t)[0];
  cur=t;
  if(prefs.mode==='scroll'){const el=stage.querySelector(`.ph[data-p="${cur}"]`);if(el)stage.scrollTo({top:el.offsetTop-14,behavior:'smooth'});updateUI();return}
  if(prefs.mode==='grid'){updateUI();return}
  render();
}
const goLeft=()=>step(rtl()?1:-1),goRight=()=>step(rtl()?-1:1);
$('btnL').addEventListener('click',goLeft);$('btnR').addEventListener('click',goRight);
$('slider').addEventListener('input',e=>{cur=+e.target.value;if(prefs.mode==='scroll'){const el=stage.querySelector(`.ph[data-p="${cur}"]`);if(el)stage.scrollTop=el.offsetTop-14;updateUI()}else render()});
document.addEventListener('keydown',e=>{
  if(!doc||!$('saveModal').hidden||/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;
  if(e.key==='ArrowLeft'){goLeft();e.preventDefault()}else if(e.key==='ArrowRight'){goRight();e.preventDefault()}
  else if(e.key==='+'||e.key===';')setZoom(zoom*1.25);else if(e.key==='-')setZoom(zoom/1.25);
});
/* tap zones + swipe on the page stage */
let tx=0,ty=0,tt=0,moved=false;
stage.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;tx=e.touches[0].clientX;ty=e.touches[0].clientY;tt=Date.now();moved=false},{passive:true});
stage.addEventListener('touchmove',()=>{moved=true},{passive:true});
stage.addEventListener('touchend',e=>{
  if(!doc||!(prefs.mode==='single'||prefs.mode==='spread')||zoom>1.001)return;
  const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  if(moved&&Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.3&&Date.now()-tt<800){
    // swipe: finger moving right shows the page on the left
    dx>0?goLeft():goRight();e.preventDefault();
  }
});
stage.addEventListener('click',e=>{
  if(!doc||e.target.closest('.grid'))return;
  const r=stage.getBoundingClientRect(),x=(e.clientX-r.left)/r.width;
  const paged=(prefs.mode==='single'||prefs.mode==='spread')&&zoom<=1.001;
  if(paged&&x<.3)goLeft();else if(paged&&x>.7)goRight();
  else document.body.classList.toggle('immersive');
});

/* ---------- view options ---------- */
$('segMode').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;prefs.mode=b.dataset.v;savePrefs();zoom=1;if(prefs.mode==='spread')cur=group(cur)[0];render()});
$('segDir').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;prefs.dir=b.dataset.v;savePrefs();render()});
$('coverBtn').addEventListener('click',()=>{prefs.cover=!prefs.cover;savePrefs();cur=group(cur)[0];render()});
function setZoom(z){if(!doc||prefs.mode==='grid')return;const c=prefs.mode==='scroll'?stage.scrollTop/(stage.scrollHeight||1):0;zoom=Math.min(4,Math.max(prefs.mode==='scroll'?.4:1,z));render();if(prefs.mode==='scroll')requestAnimationFrame(()=>{stage.scrollTop=c*stage.scrollHeight})}
$('zIn').addEventListener('click',()=>setZoom(zoom*1.25));$('zOut').addEventListener('click',()=>setZoom(zoom/1.25));$('zFit').addEventListener('click',()=>setZoom(1));
let rt;new ResizeObserver(()=>{clearTimeout(rt);rt=setTimeout(()=>{if(doc&&prefs.mode!=='grid')render()},150)}).observe(stage);

/* ---------- save as images ---------- */
const modal=$('saveModal');let urls=[];
$('saveBtn').addEventListener('click',()=>{
  const g=group(cur);$('tgtCurLabel').textContent=g.length>1?`表示中の見開き（${g[0]}-${g[1]}）`:`表示中のページ（${cur}）`;
  document.querySelector(`input[name=fmt][value=${prefs.fmt}]`).checked=true;$('dpiSel').value=prefs.dpi;
  sizeNote();modal.hidden=false;
});
$('saveClose').addEventListener('click',()=>{modal.hidden=true});
modal.addEventListener('click',e=>{if(e.target===modal)modal.hidden=true});
document.querySelectorAll('input[name=tgt]').forEach(r=>r.addEventListener('change',()=>{$('rangeIn').hidden=r.value!=='range'||!r.checked;if(r.value==='range'&&r.checked)$('rangeIn').focus()}));
$('dpiSel').addEventListener('change',()=>{prefs.dpi=$('dpiSel').value;savePrefs();sizeNote()});
document.querySelectorAll('input[name=fmt]').forEach(r=>r.addEventListener('change',()=>{prefs.fmt=r.value;savePrefs()}));
function sizeNote(){const [w,h]=pageSizes[cur-1]||[0,0],s=+$('dpiSel').value/72;$('sizeNote').textContent=`1ページあたり ${Math.round(w*s)} × ${Math.round(h*s)}px になります。`}
function parseRange(t,n){
  const out=new Set();
  for(const part of t.replace(/[　、，]/g,',').replace(/[〜～ー－]/g,'-').replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).split(',')){
    const m=part.trim().match(/^(\d+)(?:\s*-\s*(\d+))?$/);if(!m)continue;
    let a=+m[1],b=m[2]?+m[2]:a;if(a>b)[a,b]=[b,a];
    for(let i=Math.max(1,a);i<=Math.min(n,b);i++)out.add(i);
  }
  return[...out].sort((x,y)=>x-y);
}
$('makeBtn').addEventListener('click',async()=>{
  if(!doc)return;
  const tgt=document.querySelector('input[name=tgt]:checked').value,n=doc.numPages;
  const list=tgt==='all'?Array.from({length:n},(_,i)=>i+1):tgt==='cur'?group(cur):parseRange($('rangeIn').value,n);
  const prog=$('prog');prog.hidden=false;
  if(!list.length){prog.textContent=`ページ番号を「1-3, 5」のように入力してください（1〜${n}）。`;return}
  urls.forEach(u=>URL.revokeObjectURL(u));urls=[];
  const res=$('results');res.innerHTML='';$('resWrap').hidden=true;$('zipLink').hidden=true;
  const fmt=prefs.fmt,mime=fmt==='png'?'image/png':'image/jpeg',ext=fmt==='png'?'png':'jpg',sc=+$('dpiSel').value/72;
  const pad=String(n).length<2?2:String(n).length;
  const zip=list.length>1&&window.JSZip?new JSZip():null;
  $('makeBtn').disabled=true;
  try{
    for(const [k,p] of list.entries()){
      prog.textContent=`画像を作っています… ${k+1} / ${list.length}`;
      const pg=await doc.getPage(p),vp=pg.getViewport({scale:sc});
      const c=document.createElement('canvas');c.width=Math.round(vp.width);c.height=Math.round(vp.height);
      const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);
      await pg.render({canvasContext:ctx,viewport:vp}).promise;
      const blob=await new Promise(r=>c.toBlob(r,mime,.92));
      const name=`${fileBase}_p${String(p).padStart(pad,'0')}.${ext}`;
      const u=URL.createObjectURL(blob);urls.push(u);
      if(zip)zip.file(name,blob);
      const f=document.createElement('figure');
      f.innerHTML=`<img alt="${p}ページ"><figcaption></figcaption><a download>保存</a>`;
      f.querySelector('img').src=u;f.querySelector('figcaption').textContent=`${name}（${c.width}×${c.height}px）`;
      const a=f.querySelector('a');a.href=u;a.download=name;
      res.appendChild(f);$('resWrap').hidden=false;
      c.width=c.height=0;
    }
    if(zip){
      prog.textContent='ZIPにまとめています…';
      const zb=await zip.generateAsync({type:'blob'});const zu=URL.createObjectURL(zb);urls.push(zu);
      const zl=$('zipLink');zl.href=zu;zl.download=`${fileBase}_${list.length}pages.zip`;zl.hidden=false;
    }
    prog.textContent=`${list.length}枚の画像ができました。`;
  }catch(err){prog.textContent='画像を作れませんでした。解像度を下げるか、ページ数を減らしてもう一度お試しください。'}
  finally{$('makeBtn').disabled=false}
});

/* ---------- start with the sample ---------- */
updateUI();
(function(){
  const bin=atob(SAMPLE_B64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
  openData(u,'サンプル（使い方）.pdf');
})();
</script>
